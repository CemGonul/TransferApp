spring.application.name=auth-service
server.port=8081

spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5433/auth_db}
spring.datasource.username=${AUTH_DB_USERNAME:auth_user}
spring.datasource.password=${AUTH_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

security.jwt.private-key=${JWT_PRIVATE_KEY:file:private-key.pem}
security.jwt.public-key=${JWT_PUBLIC_KEY:file:public-key.pem}
security.jwt.issuer=${JWT_ISSUER:https://transferapp.local/auth-service}
security.jwt.audience=${JWT_AUDIENCE:transferapp-api}
security.jwt.expiration=${JWT_EXPIRATION:15m}
