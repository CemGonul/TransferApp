spring.application.name=transfer-service
server.port=8083

spring.datasource.url=${TRANSFER_DB_URL:jdbc:postgresql://localhost:5435/transfer_db}
spring.datasource.username=${TRANSFER_DB_USERNAME:transfer_user}
spring.datasource.password=${TRANSFER_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

app.rate-limit.transfer.max-requests=10
app.rate-limit.transfer.window-seconds=60

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

security.jwt.public-key=${JWT_PUBLIC_KEY:classpath:public-key.pem}
security.jwt.issuer=${JWT_ISSUER:https://transferapp.local/auth-service}
security.jwt.audience=${JWT_AUDIENCE:transferapp-api}

idempotency.cleanup.cron=0 0 * * * *

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

app.outbox.publisher-delay-ms=5000
